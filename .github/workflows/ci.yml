name: AIES offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check scripts/sairs_router.js
      - name: Security regression tests
        run: node tests/node_harness.js

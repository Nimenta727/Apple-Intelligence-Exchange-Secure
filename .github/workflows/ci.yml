name: AIES secure offline checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify generated bundle, syntax and security regression tests
        run: npm run check
      - name: Reject tracked certificate and capture files
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(p12|pfx|pem|key|crt|mobileconfig|pcap|pcapng)$'; then
            echo "Security error: certificate or packet capture committed"
            exit 1
          fi
          echo "No tracked certificate or capture files"
